[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketregime"
version = "0.1.0"
description = "Reproducible market-regime research and paper-trading laboratory"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["matplotlib>=3.8", "reportlab>=4"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

